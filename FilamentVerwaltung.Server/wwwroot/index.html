<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Filament">
  <title>Filament-Verwaltung</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Seitenleiste wie in der Windows-App (nur auf breiten Bildschirmen; auf dem Handy die Leiste unten) -->
  <aside class="seitenleiste" id="seitenleiste" hidden>
    <div class="logo">
      <span class="logo-bild"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg></span>
      <span><b>Filament</b><small>Verwaltung</small></span>
    </div>
    <nav class="sl-gruppe">
      <h6>Verwaltung</h6>
      <a href="#drucker" data-sl="drucker"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>Drucker<b class="sl-zahl rot" id="slWartung" hidden></b></a>
      <a href="#buchen" data-sl="buchen"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Buchen<b class="sl-zahl" id="slBuchen" hidden></b></a>
      <a href="#verlauf" data-sl="verlauf"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></svg>Drucke</a>
      <a href="#spulen" data-sl="spulen spule"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6"/></svg>Filament</a>
      <a href="#nachkauf" data-sl="nachkauf"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>Nachkauf</a>
      <a href="#statistik" data-sl="statistik"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Statistik</a>
      <a href="#dateien" data-sl="dateien"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Dateien</a>
      <a href="#warteschlange" data-sl="warteschlange"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Warteschlange</a>
      <a href="#wartung" data-sl="wartung"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg>Wartung</a>
    </nav>
    <nav class="sl-gruppe">
      <h6>Werkzeuge</h6>
      <a href="#" data-sl-aktion="druck"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Druck erfassen</a>
      <a href="#geraete" data-sl="geraete"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Drucker verwalten</a>
    </nav>
    <nav class="sl-gruppe sl-unten">
      <a href="#strom" data-sl="strom"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>Stromkosten</a>
      <a href="#homeassistant" data-sl="homeassistant"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home Assistant</a>
      <a href="#" data-sl-aktion="push"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>Benachrichtigungen</a>
      <a href="#sicherungen" data-sl="sicherungen"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>Sicherungen</a>
    </nav>
    <div class="sl-fuss">
      <span id="slVersion"></span>
      <button class="sl-status" data-seite="status" title="Server-Status"><span id="slVerbindung" class="status ok"></span></button>
    </div>
  </aside>

  <header class="kopf">
    <h1 id="titel">Filament</h1>
    <span class="kopf-rechts">
      <button id="glocke" class="glocke" title="Benachrichtigungen" hidden>
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="status-knopf" data-seite="status" title="Server-Status"><span id="verbindung" class="status"></span></button>
    </span>
  </header>

  <main id="inhalt"><p class="leer">Lade …</p></main>

  <nav class="leiste" id="leiste">
    <button data-seite="drucker">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>
      <span>Drucker</span>
    </button>
    <button data-seite="buchen">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span>Buchen</span>
      <b class="zahl" id="zahlBuchen" hidden></b>
    </button>
    <button data-seite="dateien">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>
      <span>Dateien</span>
    </button>
    <button data-seite="spulen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6"/></svg>
      <span>Spulen</span>
    </button>
    <button data-seite="mehr">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>Mehr</span>
      <b class="zahl" id="zahlMehr" hidden></b>
    </button>
  </nav>

  <div id="blatt" class="blatt" hidden>
    <div class="blatt-hinter" data-schliessen></div>
    <div class="blatt-flaeche" id="blattInhalt"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script src="verwaltung.js"></script>
</body>
</html>
