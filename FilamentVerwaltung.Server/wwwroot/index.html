<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Filament">
  <title>Filament-Verwaltung</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="kopf">
    <h1 id="titel">Filament</h1>
    <span class="kopf-rechts">
      <button id="glocke" class="glocke" title="Benachrichtigungen" hidden>
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <span id="verbindung" class="status" title="Verbindung zum Server"></span>
    </span>
  </header>

  <main id="inhalt"><p class="leer">Lade …</p></main>

  <nav class="leiste" id="leiste">
    <button data-seite="drucker">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>
      <span>Drucker</span>
    </button>
    <button data-seite="buchen">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span>Buchen</span>
      <b class="zahl" id="zahlBuchen" hidden></b>
    </button>
    <button data-seite="dateien">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>
      <span>Dateien</span>
    </button>
    <button data-seite="spulen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6"/></svg>
      <span>Spulen</span>
    </button>
  </nav>

  <div id="blatt" class="blatt" hidden>
    <div class="blatt-hinter" data-schliessen></div>
    <div class="blatt-flaeche" id="blattInhalt"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
