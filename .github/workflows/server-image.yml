# Baut das Docker-Image des Servers und legt es in der GitHub Container Registry ab:
#   ghcr.io/<besitzer>/filament-server:latest
# Läuft bei jedem Push auf master, der Kern, Server oder Dockerfile ändert – oder von Hand unter "Actions".
name: Server-Image

on:
  push:
    branches: [master]
    paths:
      - 'FilamentVerwaltung.Kern/**'
      - 'FilamentVerwaltung.Server/**'
      - 'Dockerfile'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/filament-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
